name: LikelyHome
options:
  bundleIdPrefix: com.jackieluo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LikelyHomeCore:
    path: Packages/LikelyHomeCore
targets:
  LikelyHome:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackieluo.likelyhome
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/LikelyHome.entitlements
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: LikelyHomeCore
      - target: LikelyHomeShare
        embed: true
  LikelyHomeShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackieluo.likelyhome.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/LikelyHomeShare.entitlements
        SKIP_INSTALL: YES
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: LikelyHomeCore
schemes:
  LikelyHome:
    build:
      targets:
        LikelyHome: all
        LikelyHomeShare: all
